services:
  app:
    build: .
    restart: unless-stopped
    working_dir: /var/www
    init: true
    volumes:
      - .:/var/www
    environment:
      APP_ENV: dev

  web:
    image: nginx:alpine
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
