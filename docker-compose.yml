services:
  app:
    build: .
    restart: unless-stopped
    init: true
    # Run as the host user so vendor/ and var/ stay editable outside the container.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      OWM_API_KEY: ${OWM_API_KEY:-}
      CACHE_TTL: ${CACHE_TTL:-600}
      CACHE_DIR: ${CACHE_DIR:-var/cache}
      CITIES_FILE: ${CITIES_FILE:-data/cities.dat}

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
