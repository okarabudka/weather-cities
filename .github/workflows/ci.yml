name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint
        run: composer lint
      - name: PHPStan (level max)
        run: composer stan
      - name: PHPUnit (no network, no API key)
        run: composer test

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - name: Without an API key the page explains what is missing
        run: |
          test "$(curl -s -o body.txt -w '%{http_code}' http://localhost:8080/)" = 503
          grep -q 'OWM_API_KEY is not set' body.txt
      - name: Dotfiles are not served
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.env)" = 403
      - if: failure()
        run: docker compose logs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
